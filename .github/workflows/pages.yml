# Publishes the static app in site/ to GitHub Pages.
# data.json and market.json still load from the data branch; refresh.yml is unchanged.
name: Deploy Matchup Lab site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bundle the latest data branch as the offline copy
        run: |
          # The app reads projections from the data branch. The file committed
          # on main is only the fallback, and it had stopped at Week 5. Copy the
          # published files into the Pages artifact so that fallback, and the
          # data.json URL on the site, match the hourly refresh.
          git fetch --depth=1 origin data
          git show FETCH_HEAD:data.json > site/data.json
          if git cat-file -e FETCH_HEAD:market.json; then git show FETCH_HEAD:market.json > site/market.json; fi
          if git cat-file -e FETCH_HEAD:news.json; then git show FETCH_HEAD:news.json > site/news.json; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Creates the Pages site (build type: workflow) when it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
