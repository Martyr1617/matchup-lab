# Morning check. Quiet when the app is healthy. On a failure, one GitHub issue
# labeled health-check is opened or updated and assigned to Martyr1617, which
# is what emails him. The next clean run closes that issue.
name: Matchup Lab health check
on:
  schedule:
    # 13:55 UTC is 6:55 AM Pacific Daylight Time, and 5:55 AM Pacific Standard
    # Time after the first Sunday in November. GitHub schedules are UTC only.
    - cron: '55 13 * * *'
  # A commit that touches .github/health-simulate also runs the check, so a
  # simulated failure can be exercised when workflow_dispatch is unavailable.
  push:
    branches: [main]
    paths:
      - '.github/health-simulate'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Type failure to open the health-check issue even if the app is fine'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check refresh, data, projections, and the live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate || '' }}
        run: python3 scripts/health_check.py
