name: Refresh Matchup Lab data
on:
  schedule:
    - cron: '7 * * * *'   # every hour, 7 minutes past (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-
      - run: pip install --quiet pandas==3.0.6 numpy==2.5.4
      - name: Download nflverse + build data.json
        run: bash refresh.sh
      - name: Sanity check
        run: python validate_publish.py site/data.json
      - name: Remember the previous market.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The publish step replaces the data branch, so a failed odds fetch has to
          # copy the last good market.json forward instead of omitting it.
          if git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data; then
            git show FETCH_HEAD:market.json > /tmp/prev_market.json 2>/dev/null || rm -f /tmp/prev_market.json
          fi
      - name: Vegas lines + player props (ESPN / DraftKings)
        id: market
        run: |
          set +e
          python fetch_market_espn.py site/data.json site/market.json
          code=$?
          set -e
          if [ "$code" -eq 0 ] && [ -s site/market.json ]; then
            echo "status=fresh" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ESPN odds fetch failed (exit ${code})"
            rm -f site/market.json
            if [ -s /tmp/prev_market.json ]; then
              python -c "import json; from validate_publish import mark_market_stale; previous=json.load(open('/tmp/prev_market.json')); kept=mark_market_stale(previous, 'ESPN fetch failed; kept the previous market.json'); json.dump(kept, open('site/market.json','w'), separators=(',',':')); print('kept previous market.json, marked stale')"
              echo "status=stale" >> "$GITHUB_OUTPUT"
            else
              echo "status=missing" >> "$GITHUB_OUTPUT"
              echo "::warning::No previous market.json to keep"
            fi
          fi
      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp site/data.json out/
          [ -f site/market.json ] && cp site/market.json out/ || true
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898432+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Report a stale or missing market file
        if: success() && steps.market.outputs.status != 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/refresh_issue.sh "Market lines were not refreshed (${{ steps.market.outputs.status }})"
      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/refresh_issue.sh "Data refresh failed"
      - name: Keepalive (keeps the schedule from being auto-disabled)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub turns a schedule off after 60 days with no commit on the default
          # branch. Checking one clock hour misses a delayed run, so commit whenever
          # the branch itself is at least 6 days old.
          stamp=$(git log -1 --format=%ct HEAD 2>/dev/null || true)
          [ -n "$stamp" ] || stamp=0
          now=$(date -u +%s)
          if [ $(( now - stamp )) -ge $(( 6 * 24 * 3600 )) ]; then
            date -u +%Y-%m-%dT%H:%MZ > .last_refresh
            git config user.name "github-actions[bot]"
            git config user.email "41898432+github-actions[bot]@users.noreply.github.com"
            git add .last_refresh && git commit -qm "Keepalive" && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true
          fi
