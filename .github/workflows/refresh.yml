name: Refresh Matchup Lab data
on:
  schedule:
    - cron: '7 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas==3.0.6 numpy==2.5.4
      - name: Download nflverse + build data.json
        run: bash refresh.sh
      - name: Vegas lines + player props (ESPN / DraftKings)
        run: python fetch_market_espn.py site/data.json site/market.json || echo "::warning::odds fetch failed; app falls back to schedule lines"
      - name: Sanity check
        run: |
          python - <<'PY'
          import json
          d = json.load(open('site/data.json'))
          assert len(d['players']) > 200, 'too few players'
          print('players', len(d['players']), 'last week', d['meta']['last_completed_week'], 'next', d['meta']['next_week'])
          PY
      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp site/data.json out/
          [ -f site/market.json ] && cp site/market.json out/ || true
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898432+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Weekly keepalive (keeps the schedule from being auto-disabled)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%u%H)" = "215" ]; then
            date -u +%Y-%m-%dT%H:%MZ > .last_refresh
            git config user.name "github-actions[bot]"
            git config user.email "41898432+github-actions[bot]@users.noreply.github.com"
            git add .last_refresh && git commit -qm "Keepalive" && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true
          fi
